site_name: ComfyStudy
site_description: 用 C++ 从零实现 ComfyUI 式图像生成系统的逐章中文教程
site_url: https://dreamldx.github.io/ComfyStudy/
repo_url: https://github.com/dreamldx/ComfyStudy
repo_name: dreamldx/ComfyStudy
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
exclude_docs: |
  _template/
  superpowers/

theme:
  name: cinder
  custom_dir: overrides

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# The navigation is generated from the phase READMEs by scripts/make-site-nav.py
# into mkdocs.generated.yml (which inherits this file); build with that file.
